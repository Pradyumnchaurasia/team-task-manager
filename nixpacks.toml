# Nixpacks configuration for Team Task Manager Monorepo
[phases.install]
cmds = ["npm install --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"

[variables]
DATABASE_URL = "file:./backend/prisma/dev.db"
JWT_SECRET = "super-secret-task-manager-token-key-12345"
NODE_ENV = "production"
