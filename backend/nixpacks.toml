# Nixpacks configuration for Team Task Manager Backend
[phases.install]
cmds = ["npm install", "npm install --prefix frontend"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npx prisma db push && node src/app.js"

providers = ["node"]

[variables]
DATABASE_URL = "file:/app/prisma/dev.db"
JWT_SECRET = "super-secret-task-manager-token-key-12345"
NODE_ENV = "production"
